name: One-time presentation recommendation smoke

on:
  push:
    branches: [feature/presentation-preflight-20261027]
    paths:
      - 'docs/live-recommendation-smoke-20261028.trigger'

permissions:
  contents: read

jobs:
  live-recommendation:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Warm Render then test exactly one non-persisting recommendation
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error, sys
          BASE = "https://ai-comment-presentation-20261028.onrender.com/api"
          TARGET = BASE + "/health"
          ready = False
          for attempt in range(1, 8):
              try:
                  req = urllib.request.Request(TARGET, headers={"Accept": "application/json", "User-Agent": "AI_COMMENT-OneTime-Smoke"})
                  with urllib.request.urlopen(req, timeout=70) as response:
                      data = json.loads(response.read(65536))
                      assert response.status == 200 and data.get("status") in ("ok", "degraded")
                      print("HEALTH", response.status, "model", data.get("model",{}).get("ready"), "llm", data.get("llm",{}).get("ready"), "attempt", attempt, flush=True)
                      if data.get("model",{}).get("ready") and data.get("llm",{}).get("ready"):
                          ready = True
                          break
              except Exception as e:
                  print("HEALTH FAILED", attempt, type(e).__name__, str(e)[:160], flush=True)
              time.sleep(min(attempt*8,25))
          if not ready:
              print("FAIL: health not ready; POST not sent", flush=True)
              sys.exit(1)
          payload = json.dumps({
              "post_text": "AI 에이전트 개발 과정에서 생산성을 높이는 실무 팁을 소개하는 영상입니다. 코드 리뷰와 테스트 자동화가 주요 주제입니다.",
              "top_k": 3, "persona_id": "none"
          }, ensure_ascii=False).encode()
          request = urllib.request.Request(
              BASE+"/recommend", data=payload, method="POST",
              headers={
                  "Content-Type":"application/json",
                  "Accept":"application/json",
                  "X-AI-Comment-Private-History":"1",
                  "X-AI-Comment-Account-Mode":"demo",
                  "User-Agent":"AI_COMMENT-OneTime-Smoke",
              })
          print("Sending exactly ONE smoke POST after successful health GET", flush=True)
          try:
              with urllib.request.urlopen(request, timeout=100) as response:
                  data = json.loads(response.read(1000000))
                  rows=data.get("recommendations") or []
                  print("RECOMMEND", response.status, "count",len(rows), "provider",data.get("generation",{}).get("provider"),"stored_in_legacy", False,flush=True)
                  if response.status != 200 or len(rows)<3: sys.exit(1)
          except urllib.error.HTTPError as err:
              print("RECOMMEND FAILED HTTP",err.code,"retry-after",err.headers.get("Retry-After"),"body",err.read(500).decode("utf-8","replace"),flush=True)
              sys.exit(1)
          except Exception as err:
              print("RECOMMEND FAILED",type(err).__name__,str(err)[:200],flush=True)
              sys.exit(1)
          PY
