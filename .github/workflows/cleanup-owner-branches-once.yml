name: One-time cleanup of owner-authored branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-owner-branches-once.yml']
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'JiYun1101/AI_COMMENT'
    runs-on: ubuntu-latest
    steps:
      - name: Delete reviewed owner branches, keep collaborators' branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'develop'
            'docs/readme-domain-updates'
            'feature/compact-loading-gemini-fallback'
            'feature/complete-mvp-gaps'
            'feature/embedding-similarity'
            'feature/frontend-design-system'
            'feature/llm-context-generation'
            'feature/ollama-local-fallback'
            'feature/recommendation-trace-panel'
            'feature/safety-filter-v2'
            'feature/youtube-comment-dataset'
            'feature/youtube-comment-live-smoke'
            'feature/youtube-comment-publish'
            'feature/youtube-reference-context'
            'fix/logo-asset-verified'
            'fix/main-flow-stabilization'
            'fix/revert-compact-ui-keep-spinner'
            'integration/main-consolidation'
            'integration/three-features-20261012'
            'test/runtime-validation-10'
          )
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|feature/comment-tracking-and-inbox|feature/security-observability-and-ranker-eval|feature/langgraph-comment-agent)
                echo "PRESERVE $branch"; continue ;;
            esac
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) || { echo "SKIP missing: $branch"; continue; }
            author=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha" --jq '.author.login // ""' 2>/dev/null) || { echo "SKIP cannot inspect: $branch"; continue; }
            if [ "$author" != 'JiYun1101' ]; then echo "PRESERVE other author: $branch ($author)"; continue; fi
            open_prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=JiYun1101:$branch&per_page=100" --jq 'length' 2>/dev/null) || { echo "SKIP unable to inspect PRs: $branch"; continue; }
            if [ "$open_prs" != '0' ]; then echo "PRESERVE open PR: $branch"; continue; fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "DELETED $branch at $head_sha"
          done
          echo 'Review deletion logs before removing this one-time workflow.'
