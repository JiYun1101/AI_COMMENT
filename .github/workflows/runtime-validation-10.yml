name: Runtime Validation 10

on:
  push:
    branches: ['test/runtime-validation-10']

permissions:
  contents: read

env:
  YOUTUBE_CATEGORY_REGION: KR
  AI_COMMENT_DB_PATH: /tmp/ai_comment_runtime_validation.db

jobs:
  runtime-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 'TEST 01 — .env.local is loaded exactly like local execution'
        shell: bash
        run: |
          cat > .env.local <<'ENV'
          OPENAI_API_KEY=runtime-validation-key
          OPENAI_MODEL=runtime-validation-model
          OPENAI_BASE_URL=http://127.0.0.1:9001/v1
          YOUTUBE_CATEGORY_REGION=KR
          ENV
          python - <<'PY'
          import os
          import src
          assert os.getenv('OPENAI_API_KEY') == 'runtime-validation-key'
          assert os.getenv('OPENAI_MODEL') == 'runtime-validation-model'
          assert os.getenv('OPENAI_BASE_URL') == 'http://127.0.0.1:9001/v1'
          print('repository .env.local loading: PASS')
          PY

      - name: 'TEST 02 — Backend pytest suite'
        run: pytest -q

      - name: 'TEST 03 — Frontend unit tests'
        working-directory: frontend
        run: npm test

      - name: 'TEST 04 — Frontend lint'
        working-directory: frontend
        run: npm run lint

      - name: 'TEST 05 — Frontend production build'
        working-directory: frontend
        run: npm run build

      - name: 'TEST 06 — Prepare, train, and score with real reaction ranker'
        run: |
          python scripts/prepare_combined_comments.py
          python -m src.data.preprocess
          python -m src.features.text_features
          python -m src.features.embedding_features
          python -m src.model.train
          python - <<'PY'
          from src.model.predict import model_readiness, score_comments
          readiness = model_readiness()
          assert readiness['ready'], readiness
          results = score_comments('React 상태 관리 비교 영상', ['설명이 깔끔해서 이해가 잘 됐어요.', '이 경우 서버 상태는 어떻게 다루나요?'])
          assert len(results) == 2
          assert all(0 <= item['score'] <= 100 for item in results)
          print({'model_ready': True, 'score_count': len(results)})
          PY

      - name: Start local Responses API contract stub
        shell: bash
        run: |
          cat > /tmp/responses_stub.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', '0'))
                  payload = json.loads(self.rfile.read(length) or b'{}')
                  assert self.path == '/v1/responses', self.path
                  assert payload.get('model') == 'runtime-validation-model', payload
                  assert payload.get('instructions'), payload
                  assert payload.get('input'), payload
                  candidates = [
                      {'type': 'insight', 'comment': '설명 흐름이 명확해서 핵심 차이가 잘 보이네요.'},
                      {'type': 'question', 'comment': '실제 프로젝트에서는 두 상태 관리를 어떤 기준으로 나누시나요?'},
                      {'type': 'casual', 'comment': '둘 역할을 이렇게 나눠보니 훨씬 이해하기 쉽네요 ㅋㅋ'},
                      {'type': 'empathy', 'comment': '처음 배울 때 헷갈렸던 부분인데 정리가 잘 됐어요.'},
                      {'type': 'general', 'comment': '예제까지 같이 보니까 차이가 확실히 느껴집니다.'},
                      {'type': 'insight', 'comment': '서버 상태와 클라이언트 상태를 분리해서 보는 관점이 좋네요.'},
                      {'type': 'question', 'comment': '캐시 갱신 전략도 다음 영상에서 다뤄주실 수 있나요?'},
                      {'type': 'casual', 'comment': '이런 비교 영상 찾고 있었는데 딱 필요한 내용이네요.'},
                      {'type': 'general', 'comment': '코드 기준으로 설명해줘서 바로 적용해보기 좋습니다.'},
                      {'type': 'empathy', 'comment': '상태 관리 선택 때문에 고민했는데 기준 잡는 데 도움됐어요.'},
                      {'type': 'insight', 'comment': '데이터 소유권 기준으로 구분하는 방식이 실무적으로 와닿습니다.'},
                      {'type': 'question', 'comment': 'SSR 환경에서는 이 구분이 어떻게 달라지는지도 궁금해요.'},
                      {'type': 'general', 'comment': '짧게 봐도 핵심 포인트가 잘 남는 설명이네요.'},
                      {'type': 'casual', 'comment': '팀원한테 공유하기 좋은 정리네요 👍'},
                      {'type': 'insight', 'comment': '동기화가 필요한 상태인지부터 판단하는 게 핵심 같아요.'},
                      {'type': 'general', 'comment': '비슷해 보이던 도구들이 왜 함께 쓰이는지 이해됐습니다.'},
                      {'type': 'question', 'comment': '규모가 작은 앱에서는 어느 시점부터 둘 다 쓰는 게 좋을까요?'},
                      {'type': 'empathy', 'comment': '공식 문서만 볼 때보다 훨씬 쉽게 정리되네요.'},
                      {'type': 'casual', 'comment': '예제 구조가 현실적이라 따라가기가 편했어요.'},
                      {'type': 'general', 'comment': '다음에는 에러 처리 패턴도 같이 비교해주면 좋겠습니다.'},
                  ]
                  body = json.dumps({'output_text': json.dumps({'candidates': candidates}, ensure_ascii=False)}, ensure_ascii=False).encode('utf-8')
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json; charset=utf-8')
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, format, *args):
                  return

          HTTPServer(('127.0.0.1', 9001), Handler).serve_forever()
          PY
          python /tmp/responses_stub.py > /tmp/responses_stub.log 2>&1 &
          echo $! > /tmp/responses_stub.pid

      - name: 'TEST 07 — Start backend and verify /health over HTTP'
        shell: bash
        run: |
          uvicorn src.api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          body = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert body['status'] == 'ok', body
          assert body['model']['ready'] is True, body
          assert body['llm']['ready'] is True, body
          assert body['storage']['ready'] is True, body
          assert body['youtube']['configured'] is False, body
          print({'status': body['status'], 'provider': body['llm']['provider'], 'youtube_configured': False})
          PY

      - name: 'TEST 08 — Start frontend dev server and fetch app shell'
        shell: bash
        run: |
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          echo $! > /tmp/vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /tmp/frontend.html; then break; fi
            sleep 1
          done
          grep -q '<div id="root"></div>' /tmp/frontend.html
          echo 'Vite app shell served successfully.'

      - name: 'TEST 09 — OpenAI Responses HTTP contract through real client code'
        run: |
          python - <<'PY'
          from src.llm.openai_client import OpenAIResponsesClient
          from src.recommender.generation_context import build_generation_context
          context = build_generation_context('React Query와 Zustand의 역할 차이를 설명하는 한국어 개발 영상입니다.')
          candidates = OpenAIResponsesClient().generate(context, candidate_count=10)
          assert len(candidates) >= 5, candidates
          assert all(5 <= len(item['comment']) <= 200 for item in candidates)
          print({'http_contract': 'PASS', 'candidate_count': len(candidates)})
          PY

      - name: 'TEST 10 — Full manual input → LLM client → safety → ranker → SQLite over HTTP'
        shell: bash
        run: |
          cat > /tmp/recommend.json <<'JSON'
          {
            "post_text": "React Query와 Zustand의 역할 차이를 예제 코드로 설명하는 영상입니다.",
            "additional_context": "과장하지 않고 자연스럽고 짧게",
            "top_k": 5
          }
          JSON
          curl -fsS -H 'Content-Type: application/json' --data @/tmp/recommend.json http://127.0.0.1:8000/recommend > /tmp/recommend-response.json
          python - <<'PY'
          import json, urllib.request
          body = json.load(open('/tmp/recommend-response.json', encoding='utf-8'))
          assert body['generation']['generator'] == 'llm', body
          assert body['generation']['returned_count'] == 5, body
          assert len(body['recommendations']) == 5, body
          assert body['analysis_id'].startswith('a_'), body
          analysis_id = body['analysis_id']
          with urllib.request.urlopen(f'http://127.0.0.1:8000/analyses/{analysis_id}') as response:
              detail = json.load(response)
          assert detail['id'] == analysis_id, detail
          assert detail['requested_count'] == 5, detail
          with urllib.request.urlopen('http://127.0.0.1:8000/dashboard/summary') as response:
              dashboard = json.load(response)
          assert dashboard['analysis_count'] >= 1, dashboard
          print({'analysis_id': analysis_id, 'returned_count': 5, 'persistence': 'PASS'})
          PY

      - name: External provider readiness (not counted in 10 tests)
        shell: bash
        env:
          LIVE_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LIVE_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$LIVE_OPENAI_API_KEY" ]; then echo 'OpenAI repository secret: configured'; else echo 'OpenAI repository secret: NOT CONFIGURED — live provider E2E blocked'; fi
          if [ -n "$LIVE_YOUTUBE_API_KEY" ]; then echo 'YouTube repository secret: configured'; else echo 'YouTube repository secret: NOT CONFIGURED — live URL E2E blocked'; fi

      - name: Stop runtime servers
        if: always()
        shell: bash
        run: |
          [ ! -f /tmp/uvicorn.pid ] || kill $(cat /tmp/uvicorn.pid) || true
          [ ! -f /tmp/vite.pid ] || kill $(cat /tmp/vite.pid) || true
          [ ! -f /tmp/responses_stub.pid ] || kill $(cat /tmp/responses_stub.pid) || true
