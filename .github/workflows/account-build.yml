name: Account frontend build
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/account-build.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/account-build.yml'

jobs:
  account-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
